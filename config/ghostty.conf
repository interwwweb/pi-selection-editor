# Optional Ghostty bindings for a dedicated Pi terminal/profile.
# Copy these into your MAC's Ghostty config, NOT a config on the remote server.
# WARNING: these override Command+C/X/A/Z for every application in that terminal.
# Command+V stays native: Ghostty pastes the Mac clipboard using bracketed paste.
# Super is Command on macOS. Kitty CSI-u modifier 9 = 1 + Super (8).
keybind = super+c=text:\x1b[99;9u
keybind = super+x=text:\x1b[120;9u
keybind = super+a=text:\x1b[97;9u
keybind = super+z=text:\x1b[122;9u
# Force prompt-selection keys through Ghostty rather than terminal selection/scroll actions.
keybind = shift+left=text:\x1b[1;2D
keybind = shift+right=text:\x1b[1;2C
keybind = shift+up=text:\x1b[1;2A
keybind = shift+down=text:\x1b[1;2B
# Ensure Option+Shift word selection is sent instead of interpreted by macOS.
keybind = alt+shift+left=text:\x1b[1;4D
keybind = alt+shift+right=text:\x1b[1;4C
# Select to line start/end or prompt start/end (modifier 10 = Shift + Super + 1).
keybind = super+shift+left=text:\x1b[1;10D
keybind = super+shift+right=text:\x1b[1;10C
keybind = super+shift+up=text:\x1b[1;10A
keybind = super+shift+down=text:\x1b[1;10B
